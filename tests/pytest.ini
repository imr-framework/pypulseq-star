[pytest]
testpaths = .
pythonpath = ../src
addopts = -ra --strict-markers
markers =
    unit: fast tests for one subsystem or API contract
    integration: tests that cross package boundaries
    smoke: minimal end-to-end checks
    optional: tests requiring optional dependencies
    sequence: reference-sequence acceptance tests
    semantic: guards against sequence-specific intrusions in generic layers
    fid: FID reference-sequence tests
    gre: GRE reference-sequence tests
    epi: EPI reference-sequence tests
    tse: TSE reference-sequence tests
filterwarnings =
    error
    ignore:.*distutils.*:DeprecationWarning
