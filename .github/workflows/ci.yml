name: CI

on:
  push:
    branches: [main, dev, feature/*, hotfix/*]
  pull_request:
    branches: [main, dev, feature/*, hotfix/*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plotting]"

      - name: Lint critical errors
        run: >
          python -m ruff check src tests examples
          --select E4,E7,E9,F,I
          --ignore E501

      - name: MyPy diagnostic
        continue-on-error: true
        run: python -m mypy --config-file pyproject.toml src/pypulseq_star

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plotting]"

      - name: Run complete test suite
        run: python -m pytest -q

  coverage:
    name: Coverage gate (65%)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plotting]"

      - name: Run branch coverage and generate reports
        run: >-
          python -m pytest
          --cov=pypulseq_star
          --cov-branch
          --cov-report=term-missing
          --cov-report=html:htmlcov
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-fail-under=65

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov
            coverage.xml
            coverage.json
          if-no-files-found: warn

  clean-install:
    name: Build, clean install, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel
        shell: bash
        run: |
          wheel_file="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_file}"
          python -m pip install "${wheel_file}[dev,plotting]"

      - name: Verify import comes from installed wheel
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          from pathlib import Path
          import pypulseq_star

          module_path = Path(pypulseq_star.__file__).resolve()
          repository = Path(r"${{ github.workspace }}").resolve()

          print(f"Imported from: {module_path}")

          if repository in module_path.parents:
              raise SystemExit(
                  "Package imported from checkout instead of installed wheel"
              )
          PY

      - name: Run installation and demo smoke tests
        run: >-
          python -m pytest
          tests/tests/integration/test_installation.py
          tests/tests/integration/test_four_demos.py
          -m smoke
          -ra
          --strict-markers